name: Release checks
on:
  push:
    branches: [main, 'prepare-v2.5.6']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test browser extension bridge
        shell: bash
        run: |
          node tests/browser-extension.js
          node tests/browser-poll.js
          node tests/browser-poll-bridge.js
          python tests/flatpak-updater.py
          python packaging/verify_firefox_release.py
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          modules: 'qtimageformats qtwebsockets'
          tools: 'tools_mingw1310'
          cache: true
      - name: Configure and build C++20
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "${{ github.workspace }}/../Qt/Tools" -Directory -Filter 'mingw*' | Select-Object -First 1
          $env:PATH = "$($mingw.FullName)/bin;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure
          exit $LASTEXITCODE
      - name: Package and smoke-test portable Windows build
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "${{ github.workspace }}/../Qt/Tools" -Directory -Filter 'mingw*' | Select-Object -First 1
          $env:PATH = "$($mingw.FullName)/bin;$env:PATH"
          python packaging/windows/package.py --exe build/YT-Chatterino.exe --stage build/portable/YT-Chatterino --output release-assets --version 2.5.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build/portable/YT-Chatterino/YT-Chatterino.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne '2.5.6') { throw 'Incorrect executable version.' }
          if ((Get-Item $exe).VersionInfo.FileDescription -ne 'YT-Chatterino 2.5.6v') { throw 'Incorrect Task Manager name.' }
          if ((Get-Item $exe).VersionInfo.ProductName -ne 'YT-Chatterino 2.5.6v') { throw 'Incorrect product name.' }
          # Run with only the packaged DLLs/plugins, not the build's Qt installation.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH,Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          $stdout = Join-Path $env:RUNNER_TEMP 'yt-version-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'yt-version-err.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($process.ExitCode -ne 0) { throw 'Packaged executable did not start.' }
          if (((Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)) -notlike '*2.5.6*') { throw 'Wrong packaged application version.' }
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Chatterino-Windows-2.5.6
          path: release-assets/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-test-log
          path: build/Testing/Temporary/LastTest.log
  obs-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build OBS dock with the OBS-compatible compiler
        shell: pwsh
        run: |
          cmake -S obs-plugin -B obs-build -G 'Visual Studio 17 2022' -A x64 -DBUILD_OBS_DOCK_TESTS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build obs-build --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Chatterino-OBS-Compiler-2.5.6
          if-no-files-found: error
          path: |
            obs-build/Release/yt-chatterino-obs.dll
            obs-build/Release/yt-chatterino-obs-core.dll
            obs-build/Release/yt-chatterino-obs-test-bootstrap.dll
            obs-build/Release/obs-frontend-api.dll
            obs-build/Release/obs-dock-fixture.exe
  obs-integration:
    needs: [windows, obs-windows]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: YT-Chatterino-Windows-2.5.6
          path: windows-package
      - uses: actions/download-artifact@v4
        with:
          name: YT-Chatterino-OBS-Compiler-2.5.6
          path: obs-compiler
      - name: Package the dock and test the embedded window
        shell: pwsh
        run: |
          python obs-plugin/package_obs.py --plugin obs-compiler/yt-chatterino-obs.dll --core obs-compiler/yt-chatterino-obs-core.dll --windows-zip windows-package/YT-Chatterino-Windows11-2.5.6.zip --output release-assets --version 2.5.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive release-assets/YT-Chatterino-OBS-Windows-2.5.6.zip -DestinationPath "$env:RUNNER_TEMP/obs-package"
          $env:YTCHATTERINO_OBS_DISABLE_UPDATES = '1'
          $env:YTCHATTERINO_OBS_PROFILE = "$env:RUNNER_TEMP/obs-profile"
          $env:QT_QPA_PLATFORM = 'windows'
          & "$env:GITHUB_WORKSPACE/obs-compiler/obs-dock-fixture.exe" "$env:GITHUB_WORKSPACE/obs-compiler/obs-frontend-api.dll" "$env:RUNNER_TEMP/obs-package/yt-chatterino-obs/yt-chatterino-obs.dll"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/obs-cache-fixture.py release-assets/YT-Chatterino-OBS-Windows-2.5.6.zip obs-compiler/obs-dock-fixture.exe obs-compiler/obs-frontend-api.dll obs-compiler/yt-chatterino-obs-test-bootstrap.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Chatterino-OBS-Windows-2.5.6
          path: release-assets/YT-Chatterino-OBS-Windows-2.5.6.zip
          if-no-files-found: error
  flatpak-app:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
      volumes: [/var/lib/flatpak]
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.GuiCraftBR_eu.YTChatterino.json
          bundle: YT-Chatterino-Linux-2.5.6.flatpak
          branch: stable
          run-tests: true
          artifact-name: YT-Chatterino-Flatpak-2.5.6
      - name: Install and smoke-test the app
        run: |
          flatpak install --user --noninteractive ./YT-Chatterino-Linux-2.5.6.flatpak
          QT_QPA_PLATFORM=offscreen flatpak run io.github.GuiCraftBR_eu.YTChatterino --version | grep 2.5.6
          QT_QPA_PLATFORM=offscreen timeout 10s flatpak run io.github.GuiCraftBR_eu.YTChatterino || test "$?" -eq 124
          test -d "$HOME/.var/app/io.github.GuiCraftBR_eu.YTChatterino/config/YT-Chatterino"
          python3 tests/flatpak-updater.py
  flatpak-obs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      volumes: [/var/lib/flatpak]
    steps:
      - uses: actions/checkout@v4
      - name: Install the OBS Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub com.obsproject.Studio
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.obsproject.Studio.Plugin.YTChatterino.json
          branch: stable
          build-bundle: false
          repo-dir: flatpak-repo
      - name: Package and exercise the OBS extension
        run: |
          flatpak build-bundle --runtime flatpak-repo YT-Chatterino-OBS-Linux-2.5.6.flatpak com.obsproject.Studio.Plugin.YTChatterino stable
          flatpak install --user --noninteractive ./YT-Chatterino-OBS-Linux-2.5.6.flatpak
          xvfb-run -a sh -c '
            flatpak run --env=YTCHATTERINO_OBS_TEST_MODE=1 com.obsproject.Studio --multi --disable-updater --unfiltered_log > obs-test.log 2>&1 &
            pid=$!
            i=0
            while [ "$i" -lt 45 ]; do
              if grep -q "\[YT-Chatterino\] OBS dock registered" obs-test.log; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" || true
                echo "OBS loaded the Flatpak dock."
                exit 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              i=$((i + 1)); sleep 1
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" || true
            cat obs-test.log
            exit 1
          '
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Chatterino-OBS-Flatpak-2.5.6
          path: YT-Chatterino-OBS-Linux-2.5.6.flatpak
          if-no-files-found: error
  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release 2.5.6')
    needs: [windows, obs-integration, flatpak-app, flatpak-obs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: yt-chatterino-release-2.5.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YT-Chatterino-Windows-2.5.6
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: YT-Chatterino-OBS-Windows-2.5.6
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: YT-Chatterino-Flatpak-2.5.6
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: YT-Chatterino-OBS-Flatpak-2.5.6
          path: release-assets
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v2.5.6
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 || test -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"; then
            echo 'Release or tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          python packaging/verify_firefox_release.py
          cp firefox-release/YT-Chatterino-Firefox-2.5.6.xpi release-assets/
          cp packaging/flatpak/updater.py release-assets/YT-Chatterino-Flatpak-Install.py
          curl -fL --retry 3 -o release-assets/Qt-6.8.3-Library-Sources.zip https://github.com/GuiCraftBR-eu/YT-Chatterino/releases/download/v2.1.0/Qt-6.8.3-Library-Sources.zip
          echo '8376df57d67130e3f41820db7b76cdc112da43f672d19dd32c4554bbf254524f  release-assets/Qt-6.8.3-Library-Sources.zip' | sha256sum -c -
          curl -fL --retry 3 -o /tmp/qtwebsockets-everywhere-src-6.8.3.tar.xz https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtwebsockets-everywhere-src-6.8.3.tar.xz
          echo 'fc6310c1b12d6e22a31062727aa6574ed69239d036c8a4247b3b089902709b11  /tmp/qtwebsockets-everywhere-src-6.8.3.tar.xz' | sha256sum -c -
          python packaging/add_qtwebsockets_source.py release-assets/Qt-6.8.3-Library-Sources.zip /tmp/qtwebsockets-everywhere-src-6.8.3.tar.xz
          curl -fL --retry 3 -o release-assets/qtwebsockets-everywhere-src-6.11.1.tar.xz https://download.qt.io/archive/qt/6.11/6.11.1/submodules/qtwebsockets-everywhere-src-6.11.1.tar.xz
          echo '243e3aa11924c8c5c1645e892f62d013caa3766c57512ca926d5b58146646fbf  release-assets/qtwebsockets-everywhere-src-6.11.1.tar.xz' | sha256sum -c -
          cd release-assets
          test -f YT-Chatterino-Windows11-2.5.6.zip
          test -f YT-Chatterino-OBS-Windows-2.5.6.zip
          test -f YT-Chatterino-Cpp-Source-2.5.6.zip
          test -f YT-Chatterino-Linux-2.5.6.flatpak
          test -f YT-Chatterino-OBS-Linux-2.5.6.flatpak
          sha256sum *.zip *.xpi *.flatpak *.py *.tar.xz > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title '2.5.6 — Enquetes, moderação e Flatpak' --notes-file ../.github/release-notes-2.5.6.md *.zip *.xpi *.flatpak *.py *.tar.xz SHA256SUMS.txt
          python ../packaging/verify_draft_assets.py
          gh release edit "$RELEASE_TAG" --draft=false --latest
