name: Native C++ checks
on:
  push:
    branches: [main, 'prepare-v2.1.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_mingw
          modules: 'qtimageformats'
          tools: 'tools_mingw1310'
          cache: true
      - name: Configure and build C++20
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "${{ github.workspace }}/../Qt/Tools" -Directory -Filter 'mingw*' | Select-Object -First 1
          $env:PATH = "$($mingw.FullName)/bin;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure
          exit $LASTEXITCODE
      - name: Package and smoke-test portable Windows build
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "${{ github.workspace }}/../Qt/Tools" -Directory -Filter 'mingw*' | Select-Object -First 1
          $env:PATH = "$($mingw.FullName)/bin;$env:PATH"
          python packaging/windows/package.py --exe build/YT-Chatterino.exe --stage build/portable/YT-Chatterino --output release-assets --version 2.1.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build/portable/YT-Chatterino/YT-Chatterino.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne '2.1.2') { throw 'Incorrect executable version.' }
          # Run with only the packaged DLLs/plugins, not the build's Qt installation.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH,Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          $stdout = Join-Path $env:RUNNER_TEMP 'yt-version-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'yt-version-err.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($process.ExitCode -ne 0) { throw 'Packaged executable did not start.' }
          if (((Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)) -notmatch '2\.1\.2') { throw 'Wrong packaged application version.' }
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Chatterino-Windows-2.1.2
          path: release-assets/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-test-log
          path: build/Testing/Temporary/LastTest.log
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install native dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja qt6-base qt6-svg qt6-imageformats libsecret ttf-dejavu noto-fonts-emoji xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v4
      - name: Build and test native Arch package
        run: |
          useradd -m builder
          mkdir /tmp/yt-chatterino-build
          cp -r CMakeLists.txt src tests assets docs Licenses packaging /tmp/yt-chatterino-build/
          chown -R builder:builder /tmp/yt-chatterino-build
          su builder -c 'cd /tmp/yt-chatterino-build/packaging/arch && makepkg --nodeps'
          pacman -Qip /tmp/yt-chatterino-build/packaging/arch/*.pkg.tar.zst
          pacman -U --noconfirm /tmp/yt-chatterino-build/packaging/arch/*.pkg.tar.zst
          QT_QPA_PLATFORM=offscreen yt-chatterino --version
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Chatterino-ArchLinux-2.1.2-pacman
          path: /tmp/yt-chatterino-build/packaging/arch/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-native-test-log
          path: /tmp/yt-chatterino-build/packaging/arch/src/build/Testing/Temporary/LastTest.log
  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release 2.1.2')
    needs: [arch-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: yt-chatterino-release-2.1.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YT-Chatterino-Windows-2.1.2
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: YT-Chatterino-ArchLinux-2.1.2-pacman
          path: release-assets
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v2.1.2
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'The release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          if test -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"; then
            echo 'The tag already exists; refusing to move it.' >&2
            exit 1
          fi
          curl -fL --retry 3 -o release-assets/Qt-6.8.3-Library-Sources.zip https://github.com/GuiCraftBR-eu/YT-Chatterino/releases/download/v2.1.0/Qt-6.8.3-Library-Sources.zip
          cd release-assets
          echo '8376df57d67130e3f41820db7b76cdc112da43f672d19dd32c4554bbf254524f  Qt-6.8.3-Library-Sources.zip' | sha256sum -c -
          test -f YT-Chatterino-Windows11-2.1.2.zip
          test -f YT-Chatterino-Cpp-Source-2.1.2.zip
          test -f yt-chatterino-2.1.2-1-x86_64.pkg.tar.zst
          sha256sum *.pkg.tar.zst > SHA256SUMS-ArchLinux.txt
          sha256sum *.zip *.pkg.tar.zst > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          actual_tag=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$actual_tag" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title '2.1.2 — Emotes e conexão com o YouTube' --notes-file ../.github/release-notes-2.1.2.md *.zip *.pkg.tar.zst SHA256SUMS.txt SHA256SUMS-ArchLinux.txt
          python ../packaging/verify_draft_assets.py
          gh release edit "$RELEASE_TAG" --draft=false --latest
