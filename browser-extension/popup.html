<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT-Chatterino VOD Sync</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>VOD Sync <span>Beta</span></h1><p id="intro">Open a Twitch, YouTube or Kick VOD in this tab. Paste the code shown in YT-Chatterino.</p>
<label id="code-label" for="code">Pairing code</label><input id="code" autocomplete="off" spellcheck="false" placeholder="Port:code">
<div><button id="connect">Connect this tab</button><button id="disconnect" class="secondary">Disconnect</button></div>
<p id="status" role="status">Not connected</p><p id="privacy" class="privacy">Only this tab’s video URL and playback position are sent to the app on your computer.</p>
<script src="popup.js"></script></body></html>
